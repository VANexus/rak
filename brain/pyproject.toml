[project]
name = "rak-brain"
version = "0.1.0"
description = "rak decision layer: System 1 / System 2"
# Declared dynamic on purpose, set in setup.py. setuptools' pyproject loader
# turns `requires-python` into a SpecifierSet object, and colcon reads the
# setup.py distribution with ast.literal_eval -- a SpecifierSet repr is not a
# literal, so the build dies with "invalid syntax". setup() keeps it a str.
dynamic = ["requires-python"]
dependencies = ["pydantic>=2.0.0"]

[project.optional-dependencies]
# The slow path. RAI is installed here and used only by system2.RaiConsultant.
rai = ["rai-core>=2.12.1"]
# The fast path. Optional on purpose: torch on aarch64/JetPack is an install
# risk, and the loop must run end to end without it (--decider stub).
laya = ["laya[onnx,structured]>=0.3.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rak_ai*"]
