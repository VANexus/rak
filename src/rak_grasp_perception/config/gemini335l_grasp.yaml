uvc_backend: v4l2
enumerate_net_device: false
device_num: 1
device_preset: Default

# Offline grasp snapshots consume both RGB and unregistered depth.
# The normal navigation configuration in rak_bringup remains depth-only.
enable_color: true
color_width: 1280
color_height: 800
color_fps: 30
color_format: RGB
color_frame_queue_max_frames: 1
"color.image_raw.enable_pub_plugins":
  - image_transport/raw
color_preset: ""

enable_depth: true
depth_width: 1280
depth_height: 800
depth_fps: 30
depth_format: Y16
depth_registration: false
"depth.image_raw.enable_pub_plugins":
  - image_transport/raw

enable_frame_sync: true
enable_depth_scale: true
time_domain: global
enable_sync_host_time: true
enable_publish_extrinsic: true

enable_hardware_noise_removal_filter: true
enable_noise_removal_filter: false

# IMU off: heading authority is the Jetson's LSM6DSRTR (ADR-0007), and nothing
# subscribes to the camera's accel/gyro samples.
enable_accel: false
enable_gyro: false
enable_sync_output_accel_gyro: false

# The SDK builds the cloud on the CPU, one point per depth pixel. At factor 1 that is
# 1280x800 = 1.02M points/frame; factor 4 is 320x200 = 64k, ~16x less work. Measured on
# this box: 15.2% -> 4.1% of a core for the camera container. Prefer the GPU node
# (rak_pointcloud) with enable_point_cloud:=false when a full-resolution cloud is wanted.
point_cloud_decimation_filter_factor: 4
