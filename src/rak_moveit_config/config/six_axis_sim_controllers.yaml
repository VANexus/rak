# Targets only the software action servers in rak_arm_simulation.
controller_names:
  - arm_controller
  - gripper_controller

arm_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - j1_base
    - j2_shoulder
    - j3_elbow
    - j4_forearm
    - j5_wrist_pitch
    - j6_wrist_roll

gripper_controller:
  type: GripperCommand
  action_ns: gripper_cmd
  default: true
  joints:
    - gripper_joint
