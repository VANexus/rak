# 真实六轴臂的 IK 求解器配置（纯软件层用）。
#
# 用 MoveIt 自带的 KDL 数值 IK：无需额外服务、无需额外 apt 包。
# （另一条路 rak_arm_pinocchio_kinematics.yaml 走 /solve_ik 服务，需要 pinocchio
#   python 模块 + rak_arm_pinocchio_ik 节点在跑 —— 本机当前没装 pinocchio。）
#
# 组名 `arm` 与 rak_arm.srdf 一致（chain arm_base_link -> tool0）。
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
