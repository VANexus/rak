# WHEELTEC LSDIAR N10P (Leishen N10P). Our copy of the vendor's lsx10.yaml --
# the vendored tree stays pristine so it can be re-pulled without conflicts.
#
# Only the values we actually change are here; the driver's own defaults cover
# the rest. Note there is NO baud parameter: the baud comes from the lidar_name
# profile in lslidar_driver.cc. Measured on the wire (2026-09-29, CP2102
# 10c4:ea60): the head unit streams 108-byte A5 5A frames at 460800 8N1,
# byte2=108 (len), byte3=16 (points), sum-CRC8 over the first 107 bytes OK on
# 2648/2648 packets, angle wraps 80x in 8 s = 10 Hz.
#   lidar_name "N10"    -> PACKET_SIZE 58,  baud 230400  (mismatch: CRC would
#                          be checked at byte 57 and the port is opened at the
#                          wrong baud, so no packet can ever validate)
#   lidar_name "N10_P"  -> PACKET_SIZE 108, baud 460800  (matches the wire)
# Vendor code is NOT edited; only this profile name selects baud+framing.
/lslidar_driver_node:
  ros__parameters:
    lidar_name: N10_P            # hardware is the N10P (108 B @ 460800); was N10
    interface_selection: serial
    serial_port_: /dev/wheeltec_lidar   # udev alias, see /etc/udev/rules.d/99-wheeltec-lidar*.rules
    frame_id: laser_link         # the driver's own default; do not fight it
    scan_topic: /scan_raw      # NOT /scan: the raw N10_P message is malformed
                               # (2*count_num readings under single-layer
                               # metadata). rak_sensor_bringup/config/lidar_scan_filter.yaml
                               # turns it into /scan in lidar.launch.py.
    pubScan: true
    pubPointCloud2: false        # no consumer, and it keeps PCL off the hot path
    min_range: 0.0
    max_range: 25.0              # 25 m spec (11 m on black surfaces)
    angle_disable_min: 0.0
    angle_disable_max: 0.0
