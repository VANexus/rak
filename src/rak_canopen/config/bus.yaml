# CANopen v5 总线配置（ADR-0024）—— ros2_canopen `device_container` 的 bus 配置
#
# 状态：schema 按 **上游官方形式**书写；2026-11-14 在 vcan0 上用官方
# `canopen_fake_slaves` 实测**两台从站同时加载**（chassis + arm），
# 且 2026-11-15 复测 NMT/500 Hz SYNC/SDO 全通。
#
# 驱动选 **非 lifecycle 变体**（`MasterDriver` / `ProxyDriver`）：`device_container`
# 在 `init()` 里直接 configure + activate 主站与各驱动，**不需要外部
# `/lifecycle_manager` 转移**。lifecycle 变体需要 6 s/9 s 定时敲
# `ros2 lifecycle set`，是启动时序赌博；非 lifecycle 路径在 vcan 上端到端证过。
#
# 采用官方"平铺"变体（上游 `canopen_tests/config/simple_lifecycle/bus.yml` 就是这种）：
#   options.dcf_path —— EDS/DCF 相对路径基准（由 chassis_bringup 在启动时替换占位符）
#   master           —— 主站驱动（Jetson = NMT master node 127）
#   每个从站一个顶层键 —— 键名 = proxy driver 的 ROS 节点名（chassis / arm）
#
# 为什么不用 `defaults:` + `nodes:` 变体：那是上游另一套官方形式，但本机 apt 的
# 官方 `dcfgen`（0.3.4）不解析嵌套（`KeyError: 'dcf'`），而平铺形式两个官方工具都吃。
#
# 为什么没有 COB-ID/PDO 布局：它们全部由 EDS（与 MCU SSOT JSON 同批生成）和
# `rak_canopen` 契约层决定。把 COB-ID 抄进来就是第四份帧表（ADR-0022 的原罪）。

options:
  # 写绝对路径会被拼成 .../config//opt/... 而启动即 abort（2026-11-14 实测）
  dcf_path: "@BUS_CONFIG_PATH@"

master:
  node_id: 127                 # [V5] §1：Jetson = NMT master / node 127
  driver: "ros2_canopen::MasterDriver"
  package: "canopen_master_driver"
  # SYNC 周期（µs，官方 dcfgen 会写进 master.dcf 的 0x1006）。
  # [V5] §1 定的是 2 ms = 500 Hz；TPDO1/TPDO4 的 transmission=5 靠它触发。
  sync_period: 2000

# 底盘板（vehical_rak_motion，node 1）：4 轮 + IMU
chassis:
  node_id: 1
  driver: "ros2_canopen::ProxyDriver"
  package: "canopen_proxy_driver"
  dcf: "chassis.eds"
  boot_timeout_ms: 1000        # 官方参数：等 boot-up 的窗口；无板时 3 次失败后容器 abort
  # [AI] polling 必须 false（2026-11-18 实测）：ros2_canopen 的 ProxyDriver 在
  # polling:true 时会用 SDO 周期读把 OD 写成它自己的缓存值，覆盖掉 TPDO 收到的
  # 真实数据 —— 现象极隐蔽：线上 0x281 位置一路在涨，ROS 侧 0x2020 恒定不变，
  # 底盘因此永远"轮子转但位置不动"、里程计零、`read()` 判活却拿不到新值。
  # TPDO 已经在 500 Hz SYNC 下稳定回传，不需要轮询兜底。
  polling: false
  period: 10
  diagnostics:
    enable: false              # 按板判活由 rak_chassis 薄桥做，避免双份诊断

# 机械臂板（vehical_rak_arm，node 2）：J1..J6 + 夹爪
arm:
  node_id: 2
  driver: "ros2_canopen::ProxyDriver"
  package: "canopen_proxy_driver"
  dcf: "arm.eds"
  boot_timeout_ms: 1000
  polling: true
  period: 10
  diagnostics:
    enable: false
