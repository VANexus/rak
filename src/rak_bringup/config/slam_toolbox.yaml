# slam_toolbox, mapping mode.
#
# This file deliberately mentions only the `odom` and `base_link` frame names
# and nothing about where odometry comes from. That is the whole point: the
# robot currently has no wheel encoders and no IMU, so `odom -> base_link` is
# published by rf2o (laser scan matching). When the encoders and IMU arrive it
# will be published by a robot_localization EKF instead -- and this file does
# not change. Keep it that way; putting an rf2o-specific parameter here is what
# would break that swap.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    # [AI] 2026-10-09: 切 lifelong 持久地图——位姿图存盘 data/maps/rak_room,
    # 开机自动加载并继续延伸; 搬去新区域只需 serialize 后重启, 不再从零重来。
    # (原值: mapping = 每次全新会话)
    mode: lifelong
    map_file_name: /home/xrak/rak/data/maps/rak_room
    map_start_pose: [0.0, 0.0, 0.0]

    resolution: 0.05
    # Below the 25 m sensor spec: far returns are sparse and mostly seed bad
    # scan matches. Raise only if the map comes out clipped.
    max_laser_range: 15.0

    transform_publish_period: 0.02
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    map_update_interval: 1.0
