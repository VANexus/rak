# 4D 融合状态估计（vision_nav_v2.md §2 / ADR-0027）—— odom->base_footprint 唯一发布者
#
# 与 ekf.yaml 的关系：ekf.yaml 是 v1（雷达里程计 + IMU 两路）。本文件是多传感器版，四路输入：
#   odom0  /odometry/wheel   mecanum_drive_controller 轮式里程计（差分增量；yaw 排除：麦轮打滑）
#   odom1  /odom             rf2o 激光里程计（唯一绝对位姿源）
#   odom2  /odometry/vio     rtabmap_odom 视觉里程计（差分增量；yaw 归 odom1 + imu0）
#   imu0   /imu/data_raw     LSM6DSRTR（只取 vyaw：陀螺 Z 是航向角速率权威）
#
# 规矩沿用 ekf.yaml：world_frame=odom，本滤波器只产出 odom->base_footprint；
# map->odom 归 slam_toolbox（SLAM 档）或 rtabmap（固定地图档）。不要两处同时开。
#
# 协方差全部是占位值 TODO(measured)：没有一个数字经过 Allan/直行回归标定。
# 缺失输入不会让 EKF 失败：robot_localization 等到话题出现才开始融合，
# print_diagnostics 会把"哪一路没在喂"打出来 —— 首日台架的第一个输出就是它。
#
# 格式约束（2026-11-15 实测踩过）：rcl 的 params 解析要求
#   ① 同一列表元素类型一致 —— 所有数字必须带小数点（整数 0 会让整文件解析失败）；
#   ② 协方差写成**单行 flat 列表** —— 多行块序列（"- [...]"）会报
#      "Sequences cannot be key" 而整节点起不来。225 个元素就是 row-major 15x15。
