    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    debug: false
    permit_corrected_publication: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

