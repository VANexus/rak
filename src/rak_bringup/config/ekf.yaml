# [AI] robot_localization EKF 配置 —— odom -> base_link 的唯一发布者
# 团队规矩 (usb_serial_v2.md §5 / README): EKF 独占 odom->base_link;
# slam_toolbox 独占 map->odom; RF2O/轮式/IMU 都只是 EKF 的输入。
#
# 输入分两阶段:
#   现在:   odom0 = rf2o 激光里程计 (轮式缺位时的临时主力) + imu0 = LSM6DSRTR
#   轮式就位: 追加 odom1 = mecanum_drive_controller 的 ~/odometry
#      (轮式 yaw/vyaw 按团队规矩排除或给大协方差——麦轮打滑; x/y/vx 可用)
#
# 设计要点:
#   - two_d_mode: 平面机器人, 压掉 z/roll/pitch
#   - world_frame=odom: 本滤波器只产出 odom->base_link; map->odom 归 slam_toolbox
#   - imu0 只用 vyaw: 陀螺 Z 是航向角速率权威; 无磁力计不做绝对航向;
#     加速度暂不用(零偏未标定)
#   - imu_link 帧变换由 launch 的静载 TF 提供(安装姿态待装车标定, 现为恒等)

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    print_diagnostics: false
    debug: false
    permit_corrected_publication: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --- odom0: rf2o 激光里程计 (10Hz) ---
    odom0: /odom
    odom0_config: [true,  true,  false,      # x, y
                   false, false, true,       # yaw (激光匹配航向, 非轮式)
                   true,  true,  false,      # vx, vy
                   false, false, false,      # 角速度不重复用
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # --- imu0: LSM6DSRTR (100Hz) ---
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,       # 无绝对姿态(orientation 协方差=-1)
                  false, false, false,
                  false, false, true,        # vyaw = 航向角速率权威
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10