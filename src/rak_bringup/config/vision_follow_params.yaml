# 纯视觉寻路的 Nav2 控制层覆盖（2026-11-19）
#
# 用途：给 `nav2.launch.py` 传 `params_overlay:=<本文件>`，把 FollowPath 换成
#
#     RotationShim  ->  MPPI(Omni)
#
# 为什么是这两件现成件（不要自己写控制律）：
#   * `nav2_rotation_shim_controller` —— 路径朝向与车头差超过
#     `angular_dist_threshold` 时**先原地转到朝向路径**，然后整段转发给主控制器。
#     「转弯转不过去」就是缺这一层：视觉路径是一条线，车头却不朝那条线。
#   * `nav2_mppi_controller` —— 轨迹优化器，没有手写 P 控制的稳态误差，
#     「走不到路中间」在优化器里不是增益问题。
#
# 下面副驾（MPPI）的参数**逐字镜像** `nav2_params.yaml` 的 `controller_server.
# FollowPath`：rotation shim 会把主控制器的参数从**同名节点**读出来，所以两边的
# MPPI 键值必须一致。这份镜像由 `src/rak_bringup/test/test_vision_follow_params.py`
# 门禁（改了 `nav2_params.yaml` 而没同步这里，测试会失败）。
#
# 跑法：见 `launch/road_follow_nav2.launch.py`。

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      # ---------------- 现成件：旋转闸门 ----------------
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      # 路径朝向与车头夹角超过这个值就先原地转（0.785 rad = 45°）。
      angular_dist_threshold: 0.785
      # 转到这个夹角以内才交还主控制器，留迟滞避免来回抖动。
      angular_disengage_threshold: 0.35
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      control_duration: 0.05
      # 视觉路径没有可信的终点朝向，不要求到点摆正。
      rotate_to_goal_heading: false
      rotate_to_heading_once: false
      # 用实测位姿而不是投影位姿：视觉路径的朝向本身就来自这条线。
      closed_loop: true
      # 视觉路径的 posearray.orientation 全是 w=1（没有朝向），必须关掉，
      # 否则 shim 会拿一堆恒等四元数当"路径朝向"。
      use_path_orientations: false
      forward_sampling_distance: 0.5
      transform_tolerance: 0.2

      # ---------------- 现成件：MPPI 主控制器 ----------------
      # 以下逐字镜像 nav2_params.yaml（门禁见文件头）。
      time_steps: 48
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      # DiffDrive, not Omni: mecanum strafe was measured NOT to translate on
      # the competition mat (2026-11-19, see rak_motion_stub/cmd_vel_omni.py) --
      # a pure vy command makes the robot pivot instead of sliding. Omni would
      # spend its control authority on a motion the surface cannot produce.
      motion_model: "DiffDrive"
      vx_std: 0.10
      vy_std: 0.0
      wz_std: 0.12
      vx_max: 0.25
      vx_min: 0.02
      vy_max: 0.0
      vy_min: 0.0
      wz_max: 0.50
      ax_max: 0.8
      ax_min: -0.8
      ay_max: 0.8
      ay_min: -0.8
      az_max: 1.5
      prune_distance: 1.0
      transform_tolerance: 0.2
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
