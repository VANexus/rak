# 4D 融合代价地图 overlay（vision_nav_v2.md §3 / ADR-0027）
#
# 叠加方式：nav2.launch.py 的 params_overlay 参数把它排在 nav2_params.yaml 之后，
# Nav2 按参数名合并，同名键后者覆盖 —— 这里只写要改的部分，不复制 v1 全文。
#
# 4D = 三维体素 × 时间衰减。层用 **rtabmap_costmap_plugins::VoxelLayer**
# （apt ros-jazzy-rtabmap-costmap-plugins 0.23.13，已装）：它在 Nav2 VoxelLayer 之上加了
# `decay`（体素按秒衰减），一个已有实现就同时给到 3D 标记 + 时间维度。
#
# 为什么不是 spatio_temporal_voxel_layer（STVL 2.5.5，apt 也装了）：
# 2026-11-15 本机实测（scripts/verify_4d_fusion.py 的合成传感器门）——STVL 能初始化、
# 能激活、能订阅三路源，但同一份 /scan 与 /camera/depth/points 打进去，
# /local_costmap/costmap 一个格子都没被标（max_cost=0）；换 rtabmap VoxelLayer /
# nav2 VoxelLayer 同一场景立刻标出 1549 个格（max=100）。所以 v2.0 选证明过能标的那个，
# STVL 留作 §6 的待查项（OpenVDB 稀疏网格在大范围地图上更省内存，值得回头再验）。
#
# 三路观察源（全部复用现有驱动话题，无自研代码）：
#   scan         /scan                    N10_P 雷达（10 Hz 平面；sensor_frame=laser_link）
#   depth_cloud  /camera/depth/points     depth_image_proc 生成的深度点云
#   stereo_cloud /stereo/points           stereo_image_proc 的双目点云（需标定，见 §5）
#
# 全地形口径：`min_obstacle_height` 以下的小台阶属"可翻越"，不标死（§4.2 标定表）。

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["voxel_3d_layer", "inflation_layer"]
      voxel_3d_layer:
        plugin: "rtabmap_costmap_plugins::VoxelLayer"
        enabled: true
        publish_voxel_map: false      # 排障时改 true：会多一份 PointCloud2 与 CPU
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.2
        unknown_threshold: 15
        mark_threshold: 0
        decay: 5.0                    # 秒：动态障碍消失 5 s 内放开（时间维）
        observation_sources: scan depth_cloud stereo_cloud
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_range: 6.0
          raytrace_range: 6.5
          min_obstacle_height: 0.0    # z=0 的平面扫描：min 必须留 0，否则每点都被高度滤掉
          max_obstacle_height: 1.2
        depth_cloud:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_range: 3.0
          raytrace_range: 3.5
          min_obstacle_height: 0.06   # 全地形：≤6 cm 台阶算可翻越，不标死
          max_obstacle_height: 1.2
        stereo_cloud:
          topic: /stereo/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_range: 2.5
          raytrace_range: 3.0
          min_obstacle_height: 0.06
          max_obstacle_height: 1.2

global_costmap:
  global_costmap:
    ros__parameters:
      resolution: 0.1               # 全局体素不追 5 cm：内存/更新率换覆盖范围
      plugins: ["static_layer", "voxel_3d_layer", "inflation_layer"]
      voxel_3d_layer:
        plugin: "rtabmap_costmap_plugins::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 12
        max_obstacle_height: 1.2
        unknown_threshold: 12
        mark_threshold: 0
        decay: 0.0                    # 0 = 不衰减：全局层要留慢变障碍
        observation_sources: scan depth_cloud
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_range: 8.0
          raytrace_range: 8.5
          min_obstacle_height: 0.0
          max_obstacle_height: 1.2
        depth_cloud:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_range: 3.0
          raytrace_range: 3.5
          min_obstacle_height: 0.06
          max_obstacle_height: 1.2

# 全局长路径：v1 是 NavFn（Dijkstra/8 连通，代价地图越滑它越贴障碍）。
# 这里用 SmacPlannerLattice + 上游自带的 **omni** 状态格（1.3.13 share 里就有
# sample_primitives/*/omni/output.json；2026-11-15 本机 configure 实测通过，
# 日志 "Using motion model: State Lattice"）。这是全向车唯一"原生全向"的高质量规划器：
# SmacPlannerHybrid 的 motion_model 在 1.3.13 只认 2D/DUBIN/REEDS_SHEPP/STATE_LATTICE
# （constants.hpp fromString 没有 OMNI 分支），写 Omni 会 configure 失败。
#
# lattice_filepath 由 launch 注入（4d_nav.launch.py 用
# get_package_share_directory("nav2_smac_planner") 解析），参数文件里不写死路径。
planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      downsample_costmap: false
      downsampling_factor: 1
