# xrak nav2 params. Tuned for a 2D N10P lidar + rf2o laser odom + slam_toolbox
# map. Frame tree (REP-120): world -> map -> odom -> base_footprint -> base_link,
# published by robot_state_publisher from the URDF; nav2 tracks robot_base_frame
# = base_link (resolved through TF). EKF owns odom->base_footprint.
#
# Design: this file does NOT contain AMCL or map_server. SLAM mode means
# slam_toolbox is already publishing /map and the map->odom TF, so AMCL
# would only fight it. If we ever stop slam_toolbox and want pure
# localization on a saved map, drop amcl + map_server blocks back in here.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 48
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      vx_std: 0.10
      vy_std: 0.10
      wz_std: 0.20
      vx_max: 0.25
      # [AI] 2026-10-30（chassis-control-design §6"Jetson 侧配合"）：vx_min 从
      # -0.10 提到 +0.02 —— MPPI 采样下限 = 最低平移速度钳位，避免长期爬行指令：
      # 固件 M 法测速在慢轮 0.196 rad/s（≈0.0054 m/s 车体）时 1 count 量化占
      # 读数 52%，长期爬行指令会打进 stick-slip 极限环（台架 82% 平坦样本实测）。
      # 0.02 m/s ÷ r0.0275 ≈ 0.73 rad/s，远高于 stick-slip 区。
      # basis=推断（待落地期复核）：① MPPI 从此不倒车（倒车仍可经 behavior_server
      # 的 BackUp，走 velocity_smoother 的 min_velocity=-0.10，不经本参数）；
      # ② vx+vy 对角组合下个别轮仍可能接近零速，vy 侧钳位待落地期一起标定。
      vx_min: 0.02
      vy_max: 0.15
      vy_min: -0.15
      wz_max: 0.50
      ax_max: 0.8
      ax_min: -0.8
      ay_max: 0.8
      ay_min: -0.8
      az_max: 1.5
      prune_distance: 1.0
      transform_tolerance: 0.2
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 5.0
    use_realtime_priority: false

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    use_realtime_priority: false
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

behavior_server:
  ros__parameters:
    costmap_update_timeout: 5.0
    use_realtime_priority: false
    behavior_plugins: ["spin", "backup", "drift_forward", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      spin_dist: 1.57
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.15
      backup_speed: 0.05
    drift_forward:
      plugin: "nav2_behaviors::DriveOnHeading"
      forward_distance: 0.3
      forward_speed: 0.05
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_duration: 1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # 话题不由参数决定：velocity_smoother 订阅固定名 cmd_vel（launch 里 remap 到
    # cmd_vel_nav）、发布 cmd_vel_smoothed。上游也只靠 remap 接线，这里的
    # cmd_vel_in_topic/cmd_vel_out_topic 不是它的参数（曾是无效配置，已删）。
    max_velocity: [0.25, 0.15, 0.5]   # simulation-only; replace from measured chassis limits
    min_velocity: [-0.10, -0.15, -0.5]
    # acceleration is positive (speeding up); deceleration must be NEGATIVE
    # (velocity_smoother validates this on startup; positive decel aborts the
    # whole configure pass and leaves every other node stuck unconfigured).
    max_accel: [0.8, 0.8, 1.5]
    max_decel: [-0.8, -0.8, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    use_realtime_priority: false

collision_monitor:
  ros__parameters:
    use_realtime_priority: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame: "map"
    transform_tolerance: 0.5
    cmd_vel_in_topic: "/cmd_vel_smoothed"
    cmd_vel_out_topic: "/cmd_vel"
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    observation_sources: ["scan_source"]
    scan_source:
      type: "scan"
      topic: "/scan"
      enabled: true
    polygons: ["PolygonSlow", "PolygonStop"]
    PolygonSlow:
      type: "polygon"
      points: "[[0.45, 0.32], [0.45, -0.32], [-0.45, -0.32], [-0.45, 0.32]]"
      action_type: "slowdown"
      slowdown_ratio: 0.3
      min_points: 2
      enabled: true
    PolygonStop:
      type: "polygon"
      # [AI] 2026-10-15 后沿 -0.28->-0.22: 正后方是机械臂臂体(死区, 实测近端点
      # bx=-0.268 起连续到后墙), 原 -0.28 后沿把臂体/近墙点含进来, min_points:1
      # 永久触发 stop -> /cmd_vel 死锁. 后沿与 footprint 滤波方框(0.22)对齐:
      # 后方 |y|<0.22 带内不再有 stop 区, 前方/侧向保持 0.28/0.22.
      # 代价: 后方近障不再触发 stop(PolygonSlow ±0.45 仍在, 后退仍被减速);
      # 前进 goto 不受影响. 恢复: 改回 -0.28 即可.
      points: "[[0.28, 0.22], [0.28, -0.22], [-0.22, -0.22], [-0.22, 0.22]]"
      action_type: "stop"
      min_points: 1
      enabled: true
    publish_debug: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.22           # 2026-10-14 实测外廓 30×30，对角半径 0.212 → 取 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          obstacle_range: 6.0
          raytrace_range: 8.0
          sensor_frame: laser_link

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.22           # 同 local_costmap：外廓 30×30 对角半径 0.212（2026-10-14）
      resolution: 0.05
      plugins: ["static_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        # /map is published by slam_toolbox with TRANSIENT_LOCAL durability;
        # the StaticLayer's QoS overrides must match or the layer misses the
        # first map. map_topic defaults to /map, no remap needed.
        map_topic: /map

# docking_server: lifted verbatim from
# /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml. We don't actually
# use docking on xrak (no charging dock, no charging goal), but
# lifecycle_manager_navigation's bringup pass aborts if docking_server fails
# to configure -- so we have to feed it enough params to start, then never
# call its action. The whole block below is parked and inert.
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
