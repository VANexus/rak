# ros2_control 控制器配置（CANopen v5 薄桥链路）：四轮 + 7 轴臂 + 夹爪。
#
# 协议事实源 = `src/rak_canopen/config/*.json` + `canopen_contract.yaml`；
# OD 对象映射在 `src/rak_description/urdf/rak_chassis.urdf.xacro` 的
# <ros2_control> 段；本文件只有控制器级参数，不含任何帧级事实。
#
# [AI] 2026-10-14 装车实测回填：wheels_radius=0.0275（Ø5.5 cm）、
#      sum=0.26（hw 0.1225 + ht 0.1375；轴距 24.5/轮距 27.5）。
#      物理权威 = 固件 wheel_config.h（WHEEL_RADIUS_UM / WHEEL_LEVER_UM）；geometry_gate 校验。
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz；命令刷新率（25 kHz 位置环在 MCU 里）
    use_sim_time: false
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController
    # [AI] ADR-0007 D2：臂走标准 joint_trajectory_controller，上层
    #（MoveIt / 示教 TUI）只发 FollowJointTrajectory，永远不直连链路。
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    # [AI] 夹爪第 7 路独立成组：无物理反馈（0x2116 按契约无效），JTC 的目标
    # 容差对它永远不成立，故不进 arm_controller；位置话题直发（~/commands）。
    # 2026-10-28 实测：lyrical 已无 position_controllers/JointGroupPositionController，
    # 用等价的 forward_command_controller/ForwardCommandController。
    gripper_controller:
      type: forward_command_controller/ForwardCommandController
    # [AI] WBC 臂位置流入口（ADR-0011 D1 输出②）：与 arm_controller(JTC) **共享
    # 同一批 position 命令接口**，同一时刻只能激活一个；由 chassis_bringup 的
    # arm_motion_writer 参数二选一。
    arm_position_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false

arm_controller:
  ros__parameters:
    use_sim_time: false
    # [AI] 名称/顺序 = docs/arm_moveit_contract.md §1（FROZEN）。
    joints:
      - j1_base
      - j2_shoulder
      - j3_elbow
      - j4_forearm
      - j5_wrist_pitch
      - j6_wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      # [AI] J1/J2 编码器闭环 0.03 rad（≈1.7°，TODO(measured)：台架实测后回填）；
      # J3..J6 舵机回读=指令回声（±1°），0.05 rad。都不得用于碰撞/卡死检测。
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      j1_base: {trajectory: 0.35, goal: 0.03}
      j2_shoulder: {trajectory: 0.35, goal: 0.03}
      j3_elbow: {trajectory: 0.35, goal: 0.05}
      j4_forearm: {trajectory: 0.35, goal: 0.05}
      j5_wrist_pitch: {trajectory: 0.35, goal: 0.05}
      j6_wrist_roll: {trajectory: 0.35, goal: 0.05}

gripper_controller:
  ros__parameters:
    use_sim_time: false
    joints: [gripper_joint]
    interface_name: position

# [AI] WBC 臂位置流（ADR-0011 D1）：话题 /wbc/arm_setpoints 由 spawner
# --controller-ros-args 重映射（见 chassis_bringup arm_motion_writer:=wbc）。
arm_position_controller:
  ros__parameters:
    use_sim_time: false
    joints:
      - j1_base
      - j2_shoulder
      - j3_elbow
      - j4_forearm
      - j5_wrist_pitch
      - j6_wrist_roll
    interface_name: position

mecanum_drive_controller:
  ros__parameters:
    use_sim_time: false
    # [AI] ADR-0002/0007：odom->base_footprint TF 归 rf2o/EKF，控制器不发布
    enable_odom_tf: false
    tf_frame_prefix_enable: false
    # 引用超时：无新鲜 /reference 输入 0.5s 后自动置零（安全停轮）。
    reference_timeout: 0.5
    kinematics:
      # [AI] 2026-10-14 装车实测（取代固件 R30 台架值）：
      # 轮半径 27.5 mm；sum = hw+ht = 0.26（轴距 24.5、轮距 27.5）
      # [AI] 2026-11-18 实测回填：轮盘半径 0.0275 只是轮子本体，mecanum 实际滚在
      # **滚子外缘**，有效滚动半径 0.0309。用 0.0275 时轮系里程比双传感器真值少 11%
      # （实测：四轮 19.38 rad，雷达 0.599 m / 深度 0.601 m → r_eff=0.0309）。
      wheels_radius: 0.0309
      sum_of_robot_center_projection_on_X_Y_axis: 0.26
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
    front_left_wheel_command_joint_name: front_left_wheel
    front_right_wheel_command_joint_name: front_right_wheel
    rear_left_wheel_command_joint_name: rear_left_wheel
    rear_right_wheel_command_joint_name: rear_right_wheel
    front_left_wheel_state_joint_name: front_left_wheel
    front_right_wheel_state_joint_name: front_right_wheel
    rear_left_wheel_state_joint_name: rear_left_wheel
    rear_right_wheel_state_joint_name: rear_right_wheel
