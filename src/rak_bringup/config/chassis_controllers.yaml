# [AI] ros2_control 控制器配置（CAN v4 硬件链路）：四轮 + 7 轴臂 + 夹爪。
# [AI] 2026-10-14 装车实测回填：wheels_radius=0.0275（Ø5.5 cm）、
#    sum=0.26（hw 0.1225 + ht 0.1375；轴距 24.5/轮距 27.5，外廓量法−轮径/轮宽）。
# [AI] lyrical：type 查找段在 controller_manager 下；控制器运行参数经 spawner -p 载入。
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz，与 rak_chassis 100 Hz 控制周期一致
    use_sim_time: false
    # [AI] R37 联调收尾：mock/僵尸 RSP 幽灵链路已排除（CM 载入 mock URDF 导致
    # 限幅器假象），恢复官方限幅路径（URDF command_interface min/max ±10 rad/s）
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    # [AI] ADR-0007 D2 + ADR-0012 待闭合项 #1（2026-10-14 闭合）：臂走标准
    # joint_trajectory_controller，上层（MoveIt / 示教 TUI）只发 FollowJointTrajectory，
    # 永远不直连 CAN（ADR-0016 决策 2）。
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # [AI] 夹爪第 7 路独立成组：无物理反馈（回读恒 0，契约 §2.3），JTC 的目标容差
    # 对它永远不成立，故不进 arm_controller；用位置话题直接下发。
    gripper_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false

arm_controller:
  ros__parameters:
    use_sim_time: false
    # [AI] 名称/顺序 = docs/arm_moveit_contract.md §1（FROZEN），与 URDF
    # <ros2_control> 一一对应；命令域是舵机指令角 rad（0..270°，Home 0/225/270/0/0/0）。
    joints:
      - j1_base
      - j2_shoulder
      - j3_elbow
      - j4_forearm
      - j5_wrist_pitch
      - j6_wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # [AI] Jazzy JTC 不再做"起点=当前状态"容差校验（validate_trajectory_msg 只查结构），
    # 故单点 goal 可直接被接受；轨迹从**回读**（state_current_）插值到目标——回读是
    # 固件指令回声，天然滞后一拍，可接受。刻意不用已废弃的 open_loop_control。
    # allow_motion=false 时回读不动，goal 会因容差超时 abort（TUI 屏上给出提示）。
    constraints:
      # [AI] 舵机无编码器：回读=指令回声（±1° 实测），容差按 2026-10-09 实测口径放宽，
      # 不假装毫米级精度（契约 §2.2：碰撞/卡死检测不可用该反馈）。
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      j1_base: {trajectory: 0.35, goal: 0.05}
      j2_shoulder: {trajectory: 0.35, goal: 0.05}
      j3_elbow: {trajectory: 0.35, goal: 0.05}
      j4_forearm: {trajectory: 0.35, goal: 0.05}
      j5_wrist_pitch: {trajectory: 0.35, goal: 0.05}
      j6_wrist_roll: {trajectory: 0.35, goal: 0.05}

gripper_controller:
  ros__parameters:
    use_sim_time: false
    joints:
      - gripper_joint
    interface_name: position

mecanum_drive_controller:
  ros__parameters:
    use_sim_time: false
    # [AI] ADR-0002/0007：odom->base_footprint TF 归 rf2o/EKF，控制器不发布
    enable_odom_tf: false
    tf_frame_prefix_enable: false
    # 引用超时：无新鲜 /reference 输入 0.5s 后自动置零（安全停轮）。
    # [AI] R37 联测教训：鉴别期放大到 100.0s 忘记收回，导致"停止后轮子仍转 100s"。
    # 0.5s 由 Nav2 20Hz 指令流裕度定；上层应 ≥10Hz 持续发布
    reference_timeout: 0.5
    kinematics:
      # [AI] 2026-10-14 装车实测（取代固件 R30 台架值 32.5 mm / 150 mm）：
      # 轮半径 27.5 mm（Ø5.5 cm）；sum = hw+ht = 0.1225+0.1375 = 0.26
      # （轴距 24.5、轮距 27.5，量法：前后外廓30−轮径5.5、左右外廓30−轮宽2.5）
      wheels_radius: 0.0275
      sum_of_robot_center_projection_on_X_Y_axis: 0.26
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
    front_left_wheel_command_joint_name: front_left_wheel
    front_right_wheel_command_joint_name: front_right_wheel
    rear_left_wheel_command_joint_name: rear_left_wheel
    rear_right_wheel_command_joint_name: rear_right_wheel
    front_left_wheel_state_joint_name: front_left_wheel
    front_right_wheel_state_joint_name: front_right_wheel
    rear_left_wheel_state_joint_name: rear_left_wheel
    rear_right_wheel_state_joint_name: rear_right_wheel
